# ==========================
# TMUX CONFIG - Mobile Friendly
# ==========================

# Basic settings
set -g default-terminal "screen-256color"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Auto-rename the first session to phone emoji
set-hook -g session-created 'if-shell "[ #{session_name} = \"0\" ]" "rename-session \" 📱 \""'

# Increase scrollback buffer
set -g history-limit 10000

# No delay for escape key press
set -sg escape-time 0

# ==========================
# STATUS BAR - Mobile Optimized
# ==========================

# Status bar position
set -g status-position bottom

# Status bar colors and styling
set -g status-bg '#1e1e2e'
set -g status-fg '#cdd6f4'
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'

# Status bar length - shorter for mobile
set -g status-left-length 20
set -g status-right-length 40

# Left status - compact session info
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]'

# Window status format - minimal and clean
set -g window-status-format '#[bg=#313244,fg=#cdd6f4] #I#F#W '
set -g window-status-current-format '#[bg=#f38ba8,fg=#1e1e2e,bold] #I#F#W #[bg=#1e1e2e,fg=#f38ba8]'

# Right status - essential info only
set -g status-right '#[fg=#94e2d5]%H:%M #[bg=#94e2d5,fg=#1e1e2e,bold] %m/%d '

# Window status separator
set -g window-status-separator ''

# ==========================
# PANE BORDERS
# ==========================
set -g pane-border-style 'fg=#6c7086'
set -g pane-active-border-style 'fg=#89b4fa'

# ==========================
# KEY BINDINGS - Mobile Friendly
# ==========================

# Prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane navigation with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window

# ==========================
# RESPONSIVE FEATURES
# ==========================

# Show fewer details in smaller terminals
if-shell "[ #{window_width} -lt 80 ]" {
    set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S '
    set -g status-right '#[fg=#94e2d5]%H:%M'
    set -g status-left-length 10
    set -g status-right-length 15
}

# Even more minimal for very small screens
if-shell "[ #{window_width} -lt 60 ]" {
    set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold]#S'
    set -g status-right '%H:%M'
    set -g status-left-length 8
    set -g status-right-length 8
    set -g window-status-format ' #I#F '
    set -g window-status-current-format '#[bg=#f38ba8,fg=#1e1e2e,bold] #I#F '
}